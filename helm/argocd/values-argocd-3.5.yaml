# ==============================================================================
# ArgoCD 3.5 Helm Chart Values for Multi-Cluster TIBCO BWCE GitOps
# ==============================================================================
global:
  domain: argocd-server.apps.ocp-dev.nubenetes.internal

server:
  extraArgs:
    - --insecure
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  config:
    url: https://argocd-server.apps.ocp-dev.nubenetes.internal
    application.instanceLabelKey: argocd.argoproj.io/instance
    resource.customizations: |
      argoproj.io/Rollout:
        health.lua: |
          hs = {}
          if obj.status ~= nil then
            if obj.status.phase == "Healthy" or obj.status.phase == "Paused" then
              hs.status = "Healthy"
              hs.message = "Rollout is healthy"
              return hs
            end
          end
          hs.status = "Progressing"
          return hs

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

notifications:
  enabled: true
