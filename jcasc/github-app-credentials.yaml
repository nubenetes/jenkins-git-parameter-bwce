# ==============================================================================
# JCasC GitHub App Credentials Configuration
# ==============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          - gitHubApp:
              scope: GLOBAL
              id: "nubenetes-github-app"
              description: "Nubenetes Organization GitHub App for Automated SCM Access"
              appID: "${GITHUB_APP_ID:-999999}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY:-dummy-private-key-placeholder}"
